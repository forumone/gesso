# Starterkit configuration for generating a custom theme from Gesso:
#   php web/core/scripts/drupal generate-theme my_theme --starterkit gesso
#
# Core replaces "gesso"/"Gesso" in every copied file and renames every file
# with "gesso" in its name unless it is listed here. Targeted fixes that cannot
# be expressed as whole-file exclusions live in src/StarterKit.php.

# Core defaults generated themes to the running major version (e.g. '^10'),
# which would drop Drupal 11 support. Keep Gesso's declared compatibility.
info:
  core_version_requirement: '^10.3 || ^11'

# Files that are not copied to the new theme.
ignore:
  - '/gesso.starterkit.yml'
  - '/src/StarterKit.php'
  # Compiled assets are regenerated by `npm run build`. This mirrors
  # .gitignore; dist/images and dist/video hold tracked source assets.
  - 'dist/css/**'
  - 'dist/js/**'
  - 'dist/fonts/**'
  - 'dist/design-tokens.js'
  - 'dist/images/backgrounds/**'
  - 'dist/images/sprite.artifact.svg'
  # Note: "**" does not match dot-directories (node_modules/.cache), so
  # src/StarterKit.php also removes node_modules after copying.
  - 'node_modules/**'
  # Test and Storybook output.
  - 'playwright-report/**'
  - 'test-results/**'
  - 'debug-storybook.log'
  - '.buildkite/**'
  - '.github/**'

# Files whose contents are not edited. "gesso" in these files is a Sass
# function prefix, a build/tooling name, or a drupalSettings key shared with
# the front-end code rather than the theme's machine name.
no_edit:
  # The Gesso Helper module is copied as-is and keeps its name.
  - 'gesso_helper/**'
  - 'source/**'
  - 'lib/**'
  - 'components/**/*.scss'
  - 'components/**/*.css'
  - 'components/**/*.js'
  - 'components/**/*.jsx'
  - 'components/**/*.ts'
  - '.storybook/**'
  - '.claude/**'
  - 'e2e/**'
  - 'package.json'
  - 'package-lock.json'
  - 'eslint.dev.config.js'
  - 'README.md'

# Files whose names are not changed. These are referenced by their existing
# names from Sass, Twig imports, or the Gesso Helper module's theme hooks.
no_rename:
  - 'gesso_helper/**'
  # Includes _gesso.scss and gesso.macro.twig.
  - 'source/**'
  # Includes gesso-icon--custom.html.twig, a suggestion for the Gesso Helper
  # module's gesso_icon theme hook.
  - 'templates/**'
