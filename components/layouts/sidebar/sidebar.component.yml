$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Sidebar
props:
  type: object
  properties:
    attributes:
      type:
        - object
        - string
        - "null"
      title: Attributes
      description: 'HTML attributes for the root element.'
    sidebar_header_content:
      type:
        - string
        - "null"
      title: Header Content
      description: 'Content to display in the header region.'
    sidebar_first_content:
      type:
        - string
        - "null"
      title: First Sidebar Content
      description: 'Content to display in the first sidebar region.'
    sidebar_main_content:
      type:
        - string
        - "null"
      title: Main Content
      description: 'Content to display in the main content region.'
    sidebar_second_content:
      type:
        - string
        - "null"
      title: Second Sidebar Content
      description: 'Content to display in the second sidebar region.'
    modifier_classes:
      type:
        - string
        - "null"
      title: Modifier Classes
      description: 'Additional CSS classes for custom styling.'
    region_attributes:
      type:
        - object
        - string
        - "null"
      title: Region Attributes
      description: 'HTML attributes to apply to sidebar regions.'
libraryOverrides:
  dependencies:
    - gesso/global
