$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Content
props:
  type: object
  properties:
    modifier_classes:
      type:
        - string
        - "null"
      title: Modifier Classes
      description: 'Additional CSS classes for the main content wrapper.'
    has_constrain:
      type:
        - boolean
        - "null"
      title: Has Constrain
      description: 'Whether to apply constrain wrapper around content.'
    constrain_modifier_classes:
      type:
        - string
        - "null"
      title: Constrain Modifier Classes
      description: 'Additional CSS classes for the constrain wrapper.'
    content_content:
      type: string
      title: Content
      description: 'The main content to be displayed.'
slots:
  content:
    title: Content
    description: 'Alternative slot for content instead of the prop.'
libraryOverrides:
  dependencies:
    - gesso/global
