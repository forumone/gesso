$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Dropdown Menu
props:
  type: object
  properties:
    items:
      type: array
      title: Menu Items
      description: 'Array of menu item objects containing title, url, and optional properties like below, in_active_trail, is_active, is_collapsed, is_expanded, and original_link.'
    attributes:
      type:
        - object
        - "null"
      title: Attributes
      description: 'Additional HTML attributes to apply to the menu list element.'
    menu_name:
      type:
        - string
        - "null"
      title: Menu Name
      description: 'The machine name of the menu being rendered.'
    menu_class:
      type:
        - array
        - "null"
      title: Menu Class
      description: 'Additional CSS classes to apply to the root menu element.'
    item_class:
      type:
        - array
        - "null"
      title: Item Class
      description: 'Additional CSS classes to apply to menu item elements.'
    link_class:
      type:
        - array
        - "null"
      title: Link Class
      description: 'Additional CSS classes to apply to menu link elements.'
libraryOverrides:
  dependencies:
    - gesso/global
    - core/drupal
    - core/once
