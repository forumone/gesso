$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Details
description: A details/summary disclosure widget for collapsible content.
props:
  type: object
  properties:
    attributes:
      type:
        - object
        - string
        - "null"
      title: Attributes
      description: 'HTML attributes for the root element.'
    details_summary:
      type: string
      title: Summary
      description: The summary text that is always visible.
    details_description:
      type: string
      title: Description
      description: Optional description text displayed above the content.
    modifier_classes:
      type: string
      title: Modifier Classes
      description: Additional CSS classes to apply to the component.
    required:
      type: boolean
      title: Required
      description: Whether to mark the details as required.
slots:
  details_content:
    title: Content
    description: The main content hidden inside the details element.
libraryOverrides:
  dependencies:
    - core/drupal
