$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Pager
props:
  type: object
  properties:
    pager_items:
      type: object
      title: Pager Items
      description: 'Object containing pager navigation items including pages, first, previous, next, and last links.'
    current:
      type: string
      title: Current Page
      description: 'The current page number.'
    ellipses:
      type: object
      title: Ellipses
      description: 'Object indicating where ellipsis should appear (previous and next properties).'
    heading:
      type:
        - string
        - "null"
      title: Heading
      description: 'The aria-label text for the pagination navigation. Defaults to "Pagination".'
    modifier_classes:
      type:
        - string
        - "null"
      title: Modifier Classes
      description: 'Additional CSS classes for styling variations.'
    attributes:
      type:
        - object
        - string
        - "null"
      title: Attributes
      description: 'Additional HTML attributes for the navigation element.'
    image_path:
      type:
        - string
        - "null"
      title: Image Path
      description: 'Path to the sprite artifact SVG directory.'
libraryOverrides:
  dependencies:
    - gesso/global
