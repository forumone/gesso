$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Field
props:
  type: object
  properties:
    label:
      type: string
      title: Label
      description: 'The field label text.'
    modifier_classes:
      type:
        - string
        - "null"
      title: Modifier Classes
      description: 'Additional CSS classes to apply to the field wrapper.'
    is_inline:
      type:
        - boolean
        - "null"
      title: Is Inline
      description: 'Whether to display the field inline.'
    label_display:
      type:
        - string
        - "null"
      title: Label Display
      description: 'How to display the label (e.g., "inline", "visually_hidden").'
    label_hidden:
      type:
        - boolean
        - "null"
      title: Label Hidden
      description: 'Whether to hide the label.'
    display_field_tag:
      type:
        - boolean
        - "null"
      title: Display Field Tag
      description: 'Whether to wrap the field in a tag.'
    field_tag:
      type:
        - string
        - "null"
      title: Field Tag
      description: 'The HTML tag to use for the field wrapper.'
    display_label_tag:
      type:
        - boolean
        - "null"
      title: Display Label Tag
      description: 'Whether to wrap the label in a tag.'
    label_tag:
      type:
        - string
        - "null"
      title: Label Tag
      description: 'The HTML tag to use for the label wrapper.'
    display_items_wrapper_tag:
      type:
        - boolean
        - "null"
      title: Display Items Wrapper Tag
      description: 'Whether to wrap the field items in a tag.'
    field_items_wrapper_tag:
      type:
        - string
        - "null"
      title: Field Items Wrapper Tag
      description: 'The HTML tag to use for the items wrapper.'
    display_item_tag:
      type:
        - boolean
        - "null"
      title: Display Item Tag
      description: 'Whether to wrap each field item in a tag.'
    field_item_tag:
      type:
        - string
        - "null"
      title: Field Item Tag
      description: 'The HTML tag to use for individual field items.'
    show_separator:
      type:
        - boolean
        - "null"
      title: Show Separator
      description: 'Whether to show a separator between field items.'
    separator:
      type:
        - string
        - "null"
      title: Separator
      description: 'The separator to display between field items.'
    # `field_items` is intentionally not declared as a prop. Each item's
    # `content` is a Drupal render array that often contains circular
    # references; declaring it causes ComponentValidator json_encode
    # recursion fatals. Still passed from Twig / Storybook as a free variable:
    # [{ content, attributes? }, ...].
libraryOverrides:
  dependencies:
    - gesso/global
